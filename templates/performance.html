<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Performance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6fb;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo img {
    height: 10%;
    width: 10%;
    object-fit: contain;
}

.logo-text .title {
    font-size: 20px;
    font-weight: 800;
    color: #4f46e5;
}

/* BACK BUTTON */
.back-btn {
    background: linear-gradient(135deg, #4f46e5, #9333ea);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

/* CARD */
.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.subtitle {
    color: #666;
    margin-bottom: 20px;
}

.empty {
    text-align: center;
    color: gray;
    margin-top: 30px;
}

table {
    border-collapse: collapse;
}

th, td {
    padding: 10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">
        <img src="{{ url_for('static', filename='img2.png') }}" alt="Logo">
        <div class="logo-text">
            <div class="title">Performance Dashboard</div>
        </div>
    </div>

    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<!-- MAIN -->
<div class="container">
    <div class="card">
        <h2>Performance Overview</h2>
        <div class="subtitle">Scores shown in percentage (%)</div>

        <canvas id="performanceChart"></canvas>
        <div id="emptyMsg" class="empty"></div>
    </div>
</div>

<!-- LEADERBOARD -->
<div class="container">
    <div class="card">
        <h2>🏆 Leaderboard</h2>

        <select id="testSelect" style="padding:10px; margin-bottom:15px;" onchange="changeTest()"></select>

        <table border="1" width="100%" style="text-align:center;">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>
</div>

<script>
let performanceChart = null;

// Back button
function goBack() {
    window.history.back();
}

// Load performance data
async function loadPerformance() {
    try {
        let res = await fetch("/api/performance");

        if (!res.ok) {
            throw new Error("Performance API failed");
        }

        let data = await res.json();

        if (data.error) {
            alert("Session expired. Please login again.");
            window.location.href = "/login";
            return;
        }

        if (!data.labels || data.labels.length === 0) {
            document.getElementById("performanceChart").style.display = "none";
            document.getElementById("emptyMsg").innerText =
                "No assessments attempted yet.";
            return;
        }

        const ctx = document.getElementById("performanceChart").getContext("2d");

        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, "#4f46e5");
        gradient.addColorStop(1, "#22c55e");

        // Destroy old chart if exists
        if (performanceChart) {
            performanceChart.destroy();
        }

        performanceChart = new Chart(ctx, {
            type: "bar",
            data: {
                labels: data.labels,
                datasets: [{
                    label: "Score (%)",
                    data: data.percentages,
                    backgroundColor: gradient,
                    borderRadius: 10,
                    barThickness: 25,
                    maxBarThickness: 30
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        // Populate dropdown
        let select = document.getElementById("testSelect");
        select.innerHTML = "";

        data.labels.forEach((label, index) => {
            let option = document.createElement("option");
            option.value = data.assessment_ids[index];
            option.textContent = label;
            select.appendChild(option);
        });

        // Load first leaderboard
        if (data.assessment_ids.length > 0) {
            loadLeaderboard(data.assessment_ids[0]);
        }

    } catch (err) {
        console.error("Performance Error:", err);
        alert("Error loading performance data");
    }
}

// Load leaderboard
async function loadLeaderboard(assessmentId) {
    try {
        let res = await fetch("/api/leaderboard/" + assessmentId);

        if (!res.ok) {
            throw new Error("Leaderboard API failed");
        }

        let data = await res.json();

        if (data.error) {
            alert("Session expired. Please login again.");
            window.location.href = "/login";
            return;
        }

        let tbody = document.getElementById("leaderboardBody");
        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3">No leaderboard data available</td>
                </tr>
            `;
            return;
        }

        data.forEach(row => {
            let tr = `
                <tr>
                    <td>${row.rank}</td>
                    <td>${row.name}</td>
                    <td>${row.score}</td>
                </tr>
            `;
            tbody.innerHTML += tr;
        });

    } catch (err) {
        console.error("Leaderboard Error:", err);
    }
}

// Change selected test
function changeTest() {
    let id = document.getElementById("testSelect").value;
    loadLeaderboard(id);
}

// Initialize page
loadPerformance();
</script>

</body>
</html>
