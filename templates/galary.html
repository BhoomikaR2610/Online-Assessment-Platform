<!DOCTYPE html>
<html>
<head>
    <title>Your Certificates</title>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #f8fafc;
        }

        /*  HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #1e3c72;
            font-size: 18px;
        }

        .logo img {
            width: 40px;
            height: 40px;
        }

        .back-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: #eef2ff;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2563eb;
            color: white;
        }

        /*  TITLE */
        h1 {
            text-align: center;
            padding: 20px;
            color: #1e293b;
        }

        /*  GRID */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            padding: 20px 40px 50px;
        }

        /*  CARD */
        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        /* CERTIFICATE PREVIEW */
        .preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 1000px;
            height: 650px;
            border: none;
            transform: scale(0.38);
            transform-origin: top left;
            pointer-events: none;
        }

        /*  OVERLAY CLICK */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
        }

        /*  INFO BAR */
        .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: white;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
        }

        .card:hover .label {
            opacity: 1;
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            margin-top: 80px;
            color: #64748b;
            font-size: 18px;
        }

        /*  RESPONSIVE */
        @media(max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .container {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

<!--  HEADER -->
<div class="header">

    <div class="logo">
        <img src="{{ url_for('static', filename='img2.png') }}">
        MSDC
    </div>

    <a href="{{ url_for('dashboard') }}" class="back-btn">
        ← Back
    </a>

</div>

<h1>Your Achievements</h1>

{% if certificates %}

<div class="container">

    {% for c in certificates %}
    <div class="card">

        <iframe 
            src="{{ url_for('certificate_by_id', attempt_id=c.attempt_id) }}" 
            class="preview">
        </iframe>

        <div class="label">
            {{ c.subject }} | {{ c.score }}/{{ c.total }}
        </div>

        <a href="{{ url_for('certificate_by_id', attempt_id=c.attempt_id) }}" class="overlay"></a>

    </div>
    {% endfor %}

</div>

{% else %}
<p class="empty">
    No certificates yet. Complete an assessment to earn one 🎯
</p>
{% endif %}

</body>
</html>
